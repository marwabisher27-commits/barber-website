<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>כניסת מנהל</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="login-admin-page">
    <div class="login-admin-box">
        <img src="images/logo.png" class="login-admin-logo">
        <h1>כניסת מנהל</h1>

        <input type="email" id="adminEmail" placeholder="אימייל">
        <input type="password" id="adminPassword" placeholder="סיסמה">

        <button onclick="adminLogin()">כניסה</button>

        <p id="loginError"></p>
    </div>
</section>

<script type="module" src="login.js"></script>
</body>
</html>
