<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>תשלום | Ali Kanaan Barber Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
    <div class="logo">Ali Kanaan Barber Shop ✂</div>

    <nav>
        <a href="index.html">דף הבית</a>
        <a href="products.html">מוצרים</a>
        <a href="cart.html" class="cart">
    🛒 <span id="cart-count">0</span>
</a>
    </nav>
</header>

<section class="checkout-page">
    <h1>פרטי הזמנה</h1>

    <form class="checkout-form">
        <input type="text" placeholder="שם מלא *" required>
<input 
    type="tel" 
    placeholder="מספר טלפון *" 
    required
    pattern="[0-9]{10}"
    title="יש להזין מספר טלפון בן 10 ספרות"
>
        <input type="text" placeholder="כתובת">
        <textarea placeholder="הערות להזמנה"></textarea>
        <select id="deliveryMethod" required>
    <option value="">בחר שיטת קבלה</option>
    <option value="pickup">איסוף מהמספרה</option>
    <option value="delivery">משלוח עד הבית</option>
</select>
<p class="delivery-price" id="deliveryPrice">עלות משלוח: ₪0</p> 
<p class="final-price" id="finalPrice">סה״כ לתשלום: ₪0</p>
<select id="paymentMethod" required>
    <option value="">בחר שיטת תשלום</option>
    <option value="cash">תשלום בעת קבלה</option>
    <option value="card">תשלום באשראי - בהמשך</option>
</select>
   <div class="checkout-actions">
    <button type="submit">אישור הזמנה</button>
    <a href="cart.html" class="checkout-back-arrow">→</a>
</div>
    </form>
 
</section>

<footer class="footer">
    <p>© 2026 Ali Kanaan Barber Shop | כל הזכויות שמורות</p>
</footer>
<script src="checkout.js"></script>
</body>
</html>
