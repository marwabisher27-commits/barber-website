<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניהול תורים</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2b1d14">
    <style>
    body {
        display: none;
    }
</style>
</head>
<body>
<script type="module">
    import { auth } from "./firebase.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";

    onAuthStateChanged(auth, function(user) {
        if (!user) {
            location.replace("login.html");
        } else {
            document.body.style.display = "block";
        }
    });
</script>


<section class="admin-page">
    <div class="admin-header-bar">
        <div class="admin-header-title">Ali Kanaan Barber Shop</div>
        <img src="images/logo.png" class="admin-header-logo" alt="logo">
    </div>

    <h1>ניהול תורים</h1>

<div class="admin-actions-card">
        <a href="unpaid.html" class="admin-unpaid-link">רשימת לא שולם</a>

   <button id="enableNotificationsBtn" class="enable-notifications-btn">
    🔔 הפעל התראות
</button>
<button id="disableNotificationsBtn" class="disable-notifications-btn">
    🔕 כיבוי התראות
</button>
    <button class="admin-logout" onclick="logoutAdmin()">
        יציאה
    </button>
</div>

    <div class="admin-filter-box">
        <select id="adminMonth"></select>
        <select id="adminYear"></select>
    </div>

    <div class="admin-week-nav">
        <button id="prevWeekBtn" class="week-arrow">❮</button>
        <span id="weekRange"></span>
        <button id="nextWeekBtn" class="week-arrow">❯</button>
    </div>

    <div id="adminDays" class="admin-days-cards"></div>

    <div id="adminDaySchedule" class="admin-day-schedule"></div>

    <div id="adminClientDetails" class="admin-client-details"></div>

    <footer class="admin-footer">
        ©️ 2026 Ali Kanaan Barber Shop | כל הזכויות שמורות
    <br>
    Website developed by Marwa Bisher 
    </footer>
</section>

<script type="module" src="admin.js?v=audio2"></script>
<script type="module">
    import { auth } from "./firebase.js";
    import { signOut } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";

    window.logoutAdmin = async function() {
        await signOut(auth);
        localStorage.removeItem("adminLoggedIn");
        location.replace("login.html");
    };
</script>

</body>
</html>
