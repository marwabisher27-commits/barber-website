<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>כניסת מנהל</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2b1d14">
</head>
<body>

<section class="login-admin-page">
    <div class="login-admin-box">
        <img src="images/logo.png" class="login-admin-logo">
        <h1>כניסת מנהל</h1>

        <input type="email" id="adminEmail" placeholder="אימייל">
        <input type="password" id="adminPassword" placeholder="סיסמה">

        <button onclick="adminLogin()">כניסה</button>

        <p id="loginError"></p>
    </div>
</section>

<script type="module" src="login.js"></script>
<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js");
}
</script>
</body>
</html>
